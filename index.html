<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16161d" />
<title>FoosBots</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
<script>
  // Minimal stand-in for the Dynatrace platform runtime so Strato runs standalone.
  window.dtRuntime = {
    userPreferences: {
      getTheme: function () { return 'dark'; },
      getLanguage: function () { return 'en'; },
      getRegionalFormat: function () { return 'en-US'; },
      getTimezone: function () { return Intl.DateTimeFormat().resolvedOptions().timeZone; }
    },
    appEnvironment: {
      getAppId: function () { return 'foosbots'; },
      getAppName: function () { return 'FoosBots'; },
      getAppVersion: function () { return '1.0.0'; },
      getEnvironmentId: function () { return 'local'; },
      getEnvironmentUrl: function () { return location.origin; }
    }
  };
</script>
<script src="./polyfills.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  // Last-resort error display: if the app dies and the page goes blank, show why.
  (function () {
    function show(msg) {
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.innerText.trim().length > 0) return;
        if (document.getElementById('fatal')) return;
        var d = document.createElement('pre');
        d.id = 'fatal';
        d.style.cssText = 'white-space:pre-wrap;word-break:break-word;color:#fca5a5;background:#1e1e27;padding:16px;margin:16px;border-radius:8px;font:12px/1.4 monospace';
        d.textContent = 'FoosBots crashed:\n\n' + msg + '\n\n' + navigator.userAgent;
        document.body.appendChild(d);
      }, 50);
    }
    window.addEventListener('error', function (e) {
      show((e.error && e.error.stack) || e.message || String(e));
    });
    window.addEventListener('unhandledrejection', function (e) {
      show((e.reason && e.reason.stack) || String(e.reason));
    });
  })();
</script>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
